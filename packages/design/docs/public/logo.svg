<!--
  Beauty Design 标识(beauty moon)。
  几何取自官方 favicon.svg(apps/web/public/favicon.svg):夜空底瓦片 + 月光米月亮 +
  云镂空;与 apps/web 的 BrandChip 同一来源,仅放大到 128 画布(坐标 ×2),
  保证两个项目读到的是同一份品牌几何,不会各自漂移。
  颜色:夜空为官方径向渐变(#331E6E → #150E31),月面官方月光米 #FFEFC6,
  深浅主题均有对比,无需跟随令牌换色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Beauty Design">
  <title>Beauty Design</title>
  <defs>
    <radialGradient id="bd-logo-sky" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#331E6E"/>
      <stop offset="1" stop-color="#150E31"/>
    </radialGradient>
    <mask id="bd-logo-moon-cut">
      <circle cx="64" cy="60" r="36" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="58" y="93" width="34" height="14" rx="5"/>
        <circle cx="65" cy="91" r="4.4"/>
        <circle cx="76" cy="88" r="8"/>
        <circle cx="85" cy="91" r="5"/>
      </g>
    </mask>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bd-logo-sky)"/>
  <circle cx="64" cy="60" r="36" fill="#FFEFC6" mask="url(#bd-logo-moon-cut)"/>
</svg>
