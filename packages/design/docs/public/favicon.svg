<!--
  Beauty Design 页签图标。
  与官方 favicon.svg(apps/web/public/favicon.svg)同一几何:夜空底 +
  月光米月亮 + 云镂空,小尺寸下云镂空相对月径更大,16px 仍读得出"月 + 云"。
  两处文件保持逐字节同构(仅 id 前缀与标题不同),改几何时两侧同步。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Beauty Design">
  <title>Beauty Design</title>
  <defs>
    <radialGradient id="bd-favicon-sky" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#331E6E"/>
      <stop offset="1" stop-color="#150E31"/>
    </radialGradient>
    <mask id="bd-favicon-moon-cut">
      <circle cx="32" cy="30" r="18" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="29" y="46.5" width="17" height="7" rx="2.5"/>
        <circle cx="32.5" cy="45.5" r="2.2"/>
        <circle cx="38" cy="44" r="4"/>
        <circle cx="42.5" cy="45.5" r="2.5"/>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bd-favicon-sky)"/>
  <circle cx="32" cy="30" r="18" fill="#FFEFC6" mask="url(#bd-favicon-moon-cut)"/>
</svg>
