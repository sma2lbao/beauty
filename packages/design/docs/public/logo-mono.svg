<!--
  Beauty Design 单色标识(透明底,墨色跟随系统深浅色)。
  几何取自官方 logo-mark(apps/web/src/components/brand/logo.tsx 的 BrandMark):
  圆月 + 云为负空间镂空,与 web 端大尺寸标识同一来源。
  用于 README 等需要与文字同色的场景;夜空瓦片版本见 logo.svg。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 96 320 320" width="128" height="128" role="img" aria-label="Beauty Design">
  <title>Beauty Design</title>
  <defs>
    <mask id="bd-logo-mono-cut">
      <circle cx="256" cy="256" r="160" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="248" y="396" width="124" height="46" rx="20"/>
        <circle cx="268" cy="392" r="20"/>
        <circle cx="312" cy="382" r="34"/>
        <circle cx="346" cy="392" r="22"/>
      </g>
    </mask>
    <style>
      .bd-logo-ink { fill: #2e1b24; }
      @media (prefers-color-scheme: dark) { .bd-logo-ink { fill: #f2ecf4; } }
    </style>
  </defs>
  <circle class="bd-logo-ink" cx="256" cy="256" r="160" mask="url(#bd-logo-mono-cut)"/>
</svg>
