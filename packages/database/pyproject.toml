[project]
name = "database"
version = "0.1.0"
description = "数据库共享基座:表命名约定、DeclarativeBase、Repository/UoW、测试夹具"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database"]

[tool.coverage.run]
branch = true
source = ["database"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/database/html'
 --cov-report xml:'../../coverage/packages/database/coverage.xml'
 --html='../../reports/packages/database/unittests/html/index.html'
 --junitxml='../../reports/packages/database/unittests/junit.xml'
 --cov-fail-under=88
 --disable-socket --allow-unix-socket
"""
asyncio_mode = "auto"

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "testcontainers[postgres]>=4.15.0",
]
