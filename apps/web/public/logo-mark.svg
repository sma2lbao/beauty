<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="beauty-moon mark">
  <defs>
    <!-- 负空间：云为透明镂空波痕，位于满月右下缘，随背景色显现 -->
    <mask id="moonCut">
      <circle cx="256" cy="256" r="160" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="248" y="396" width="124" height="46" rx="20"/>
        <circle cx="268" cy="392" r="20"/>
        <circle cx="312" cy="382" r="34"/>
        <circle cx="346" cy="392" r="22"/>
      </g>
    </mask>
  </defs>

  <circle cx="256" cy="256" r="160" fill="#FFEFC6" mask="url(#moonCut)"/>
</svg>
