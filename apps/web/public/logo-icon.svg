<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="beauty-moon app icon">
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#331E6E"/>
      <stop offset="1" stop-color="#150E31"/>
    </radialGradient>
    <!-- 负空间：云的上缘轮廓擦过满月右下缘 -->
    <mask id="moonCut">
      <circle cx="256" cy="250" r="136" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="246" y="370" width="112" height="40" rx="18"/>
        <circle cx="264" cy="368" r="17"/>
        <circle cx="302" cy="354" r="30"/>
        <circle cx="332" cy="366" r="19"/>
      </g>
    </mask>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#sky)"/>
  <circle cx="256" cy="250" r="136" fill="#FFEFC6" mask="url(#moonCut)"/>
</svg>
