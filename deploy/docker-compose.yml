# beauty-moon 全栈演示编排(docs/refactoring/rfc/005-w4.md §R-36)。
#
# 快速开始(在仓库根执行):
#   docker compose -f deploy/docker-compose.yml up -d --build
#   浏览器打开 http://localhost:8080
# 只起基础设施(本地开发常用,docs/local-dev.md):
#   docker compose -f deploy/docker-compose.yml up -d postgres redis
# 停止/重置数据:
#   docker compose -f deploy/docker-compose.yml down        # 保留数据卷
#   docker compose -f deploy/docker-compose.yml down -v     # 连数据卷一起删(重建 6 个库)
#
# 设计要点:
# - 8 个 Python 服务复用同一个镜像(deploy/docker/python-service.Dockerfile,靠 SERVICE 选入口);
# - 6 个有 alembic 迁移的服务各自一个库,由 initdb 脚本建库 + migrate 一次性作业升级;
#   原因见 deploy/postgres/initdb/01-create-databases.sql(alembic_version 表名冲突);
# - web 容器(nginx)同源托管 SPA 并反代 /api → api-gateway:8007;浏览器只访问 :8080 一个入口;
# - 健康探针一律打 /healthz(进程存活,不依赖数据库);/readyz 是给编排层的就绪建议;
#   8 个 Python 服务的探针由镜像 HEALTHCHECK 提供(deploy/docker/python-service.Dockerfile:71,
#   端口按 SERVICE 映射),compose 仅在 pg/redis 上显式声明 healthcheck;
# - 所有演示用密钥可用宿主机环境变量覆盖(见 deploy/web/README.md「生产差异」),
#   默认值只用于本机演示,禁止直接用于生产。
name: beauty-moon

x-python-build: &python-build
  context: ..
  dockerfile: deploy/docker/python-service.Dockerfile

# 有数据库的服务统一:等 postgres 健康 + migrate 升级成功后再启动。
x-db-depends: &db-depends
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

# 观测栈(Langfuse v4)四件依赖就绪后才启动 web/worker,见 docs/design/langfuse-observability.md。
x-langfuse-depends: &langfuse-depends
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy

services:
  # ── 基础设施 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty
    ports:
      # 只为本地 psql/alembic 调试暴露;生产请删掉端口映射,只走 compose 内网。
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅首次初始化数据卷时执行:建 6 个服务库(beauty_account 等)。
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beauty']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # 限流后端:api-gateway 与 account-service 配置 <PREFIX>__REDIS_URL 后走 Redis
    # 固定窗口(多副本共享计数);不配则回退进程内滑动窗口(见 docs/design/rate-limiting.md)。
    # 本容器只被这两个服务使用,其余服务仍为纯进程内限流。
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 一次性迁移作业:按服务库顺序 alembic upgrade head ──────────────────────
  # 用 Python 服务镜像即可:根 .venv 同时装了 alembic 与全部服务包;
  # 每个服务 migrations/env.py 从自己的 <PREFIX>__DATABASE_URL 读库地址。
  migrate:
    build:
      <<: *python-build
      args:
        SERVICE: api-gateway
    image: beauty-moon/python-migrate:local
    command:
      - sh
      - -c
      - |
        set -eu
        cd /app/services/account-service && alembic upgrade head
        cd ../agent-orchestrator && alembic upgrade head
        cd ../connector-service && alembic upgrade head
        cd ../knowledge-service && alembic upgrade head
        cd ../workspace-service && alembic upgrade head
        cd ../tool-service && alembic upgrade head
        echo "migrations: all 6 databases at head"
    environment:
      ACCOUNT__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_account
      AGENT_ORCHESTRATOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_agent
      CONNECTOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_connector
      KNOWLEDGE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_knowledge
      WORKSPACE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_workspace
      TOOL__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_tool
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ── Python 服务(同一镜像、不同 SERVICE) ─────────────────────────────────
  account-service:
    build:
      <<: *python-build
      args:
        SERVICE: account-service
    image: beauty-moon/account-service:local
    environment:
      ACCOUNT__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_account
      ACCOUNT__AUTO_CREATE_TABLES: 'false'
      # 演示统一关鉴权(API 网关仍按 session 流程代理;生产改 true 并配 issuer/JWKS)
      ACCOUNT__AUTH_ENABLED: 'false'
      # 签名密钥落 /data/keys 具名卷,重启不轮换 kid(生产必须持久化,见 README)
      ACCOUNT__SIGNING_KEY_PATH: /data/keys/account-signing-key.pem
      ACCOUNT__INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      ACCOUNT__OAUTH_STATE_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      ACCOUNT__OAUTH21_WEB_ORIGIN: http://localhost:8080
      # 动态注册限流共享计数;注释掉该行即回退进程内滑动窗口。
      ACCOUNT__REDIS_URL: redis://redis:6379/0
    volumes:
      - account-keys:/data/keys
    depends_on:
      <<: *db-depends
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent-orchestrator:
    build:
      <<: *python-build
      args:
        SERVICE: agent-orchestrator
    image: beauty-moon/agent-orchestrator:local
    environment:
      AGENT_ORCHESTRATOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_agent
      AGENT_ORCHESTRATOR__AUTO_CREATE_TABLES: 'false'
      AGENT_ORCHESTRATOR__AUTH_ENABLED: 'false'
      AGENT_ORCHESTRATOR__INTERNAL_AUTH_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      AGENT_ORCHESTRATOR__ACCOUNT_SERVICE_URL: http://account-service:8001
      AGENT_ORCHESTRATOR__LLM_GATEWAY_URL: http://llm-gateway:8003
      # 演示默认不连真实模型:置 LLM_ENABLED=true 并给 LLM_GATEWAY_API_KEY 后
      # 工作台对话走真实模型(见 README「接入真实模型」)。
      AGENT_ORCHESTRATOR__LLM_ENABLED: ${LLM_ENABLED:-false}
      AGENT_ORCHESTRATOR__TOOLS_ENABLED: 'false'
      # 内置工具服务(docs/design/tool-service.md):默认 false 走进程内旧路径;
      # 置 TOOL_SERVICE_ENABLED=true 且 account/workspace 鉴权可达后走 tool-service。
      AGENT_ORCHESTRATOR__TOOL_SERVICE_ENABLED: ${TOOL_SERVICE_ENABLED:-false}
      AGENT_ORCHESTRATOR__TOOL_SERVICE_URL: http://tool-service:8008
      AGENT_ORCHESTRATOR__KNOWLEDGE_ENABLED: 'false'
      AGENT_ORCHESTRATOR__KNOWLEDGE_SERVICE_URL: http://knowledge-service:8006
      AGENT_ORCHESTRATOR__WORKSPACE_ENABLED: 'false'
      AGENT_ORCHESTRATOR__WORKSPACE_SERVICE_URL: http://workspace-service:8005
      AGENT_ORCHESTRATOR__OUTBOX_ENABLED: 'false'
      AGENT_ORCHESTRATOR__MCP_SECRET: ${MCP_SECRET:-compose-demo-mcp-secret-change-me}
      AGENT_ORCHESTRATOR__MCP_RESOURCE_URL: http://localhost:8080/mcp
      AGENT_ORCHESTRATOR__MCP_OAUTH_REDIRECT_URI: http://localhost:8080/api/mcp/oauth/callback
      AGENT_ORCHESTRATOR__CORS_ALLOW_ORIGINS: '["http://localhost:8080"]'
      # 观测(可选):--profile observability 起 Langfuse 后,置 LANGFUSE_ENABLED=true 才上报。
      # trace_sample_ratio 默认 0.1 会丢 90% trace;本地演示给 1.0(指标永不采样)。
      AGENT_ORCHESTRATOR__LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      # 默认指向 Langfuse Cloud(https://cloud.langfuse.com);用自托管观测 profile 时
      # 传 LANGFUSE_HOST=http://langfuse-web:3000,pk/sk 用 compose 预建的 pk-lf-beauty/sk-lf-beauty。
      AGENT_ORCHESTRATOR__LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      AGENT_ORCHESTRATOR__LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      AGENT_ORCHESTRATOR__LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 生产默认 0.1(10% 采样);本地演示可传 TRACE_SAMPLE_RATIO=1.0。
      # 走 Collector 尾部采样时必须传 1.0,否则错误 trace 在服务侧就丢了。
      AGENT_ORCHESTRATOR__TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-0.1}
      # 非空则先发给 OTel Collector(observability profile 的 otel-collector),
      # 例如 http://otel-collector:4318/v1/traces;为空仍直连 Langfuse。
      AGENT_ORCHESTRATOR__OTLP_COLLECTOR_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
    depends_on: *db-depends
    restart: unless-stopped

  llm-gateway:
    build:
      <<: *python-build
      args:
        SERVICE: llm-gateway
    image: beauty-moon/llm-gateway:local
    environment:
      # 模型提供商凭据由宿主机环境变量透传;留空则每次请求 502(服务本身仍健康)。
      LLM_GATEWAY__API_KEY: ${LLM_GATEWAY_API_KEY:-}
      LLM_GATEWAY__API_BASE: ${LLM_GATEWAY_API_BASE:-}
      LLM_GATEWAY__DEFAULT_MODEL: ${LLM_GATEWAY_DEFAULT_MODEL:-deepseek/deepseek-chat}
      # BYOK:按 X-Account-Id + X-Internal-Secret 解析账号密钥(与 account 同源)
      LLM_GATEWAY__INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      # 容器内必须走服务名:默认 127.0.0.1:8001 会指向网关自身,BYOK 解析全失败
      LLM_GATEWAY__ACCOUNT_BASE_URL: http://account-service:8001
      # 观测(可选):generation span 上报 Langfuse;LOG_CONTENT=true 才记录 prompt/输出正文
      LLM_GATEWAY__LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LLM_GATEWAY__LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LLM_GATEWAY__LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LLM_GATEWAY__LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LLM_GATEWAY__TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-0.1}
      LLM_GATEWAY__OTLP_COLLECTOR_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      LLM_GATEWAY__LOG_CONTENT: ${LLM_GATEWAY_LOG_CONTENT:-false}
    restart: unless-stopped

  connector-service:
    build:
      <<: *python-build
      args:
        SERVICE: connector-service
    image: beauty-moon/connector-service:local
    environment:
      CONNECTOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_connector
      CONNECTOR__AUTO_CREATE_TABLES: 'false'
      CONNECTOR__AUTH_ENABLED: 'false'
      CONNECTOR__CREDENTIAL_SECRET: ${CONNECTOR_CREDENTIAL_SECRET:-compose-demo-connector-secret-change-me}
      # 当前无内置 provider(目录为空):内置 Notion provider 已于 2026-11-04 移除。
      # Notion 改走官方 MCP(https://mcp.notion.com/mcp):在 Web /connectors 一键授权,
      # 凭证由 agent-orchestrator 的 mcp_server_auth 托管,本服务不再需要 NOTION_* 变量。
      # 接入新 provider 时再设 CONNECTOR__PROVIDERS_ENABLED=<key> 并补对应凭证。
      CONNECTOR__INTERNAL_SECRET: ${CONNECTOR_INTERNAL_SECRET:-compose-demo-connector-internal-secret}
      # 浏览器回跳经同源网关 → connector-service;须与 provider 后台登记的重定向 URL 一致。
      CONNECTOR__OAUTH_REDIRECT_BASE: ${CONNECTOR_OAUTH_REDIRECT_BASE:-http://localhost:8080/api/connector}
      CONNECTOR__OAUTH_SUCCESS_REDIRECT: ${CONNECTOR_OAUTH_SUCCESS_REDIRECT:-http://localhost:8080/connectors}
    depends_on: *db-depends
    restart: unless-stopped

  knowledge-service:
    build:
      <<: *python-build
      args:
        SERVICE: knowledge-service
    image: beauty-moon/knowledge-service:local
    environment:
      KNOWLEDGE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_knowledge
      KNOWLEDGE__AUTO_CREATE_TABLES: 'false'
      KNOWLEDGE__AUTH_ENABLED: 'false'
      # 演示用本地词法嵌入(零网络);接真嵌入模型时改为网关提供方。
      KNOWLEDGE__EMBEDDING_PROVIDER: local
      KNOWLEDGE__LLM_GATEWAY_URL: http://llm-gateway:8003
      # 与 account/gateway 的 INTERNAL_SECRET 同源:网关按账号解析 BYOK 密钥
      KNOWLEDGE__INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
    depends_on: *db-depends
    restart: unless-stopped

  workspace-service:
    build:
      <<: *python-build
      args:
        SERVICE: workspace-service
    image: beauty-moon/workspace-service:local
    environment:
      WORKSPACE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_workspace
      WORKSPACE__AUTO_CREATE_TABLES: 'false'
      WORKSPACE__AUTH_ENABLED: 'false'
      WORKSPACE__ARTIFACT_ROOT: /data/artifacts
      # 演示不启动沙箱回收器(否则会尝试连接 microsandbox 运行时并刷错误日志)
      WORKSPACE__SANDBOX_REAPER_ENABLED: 'false'
    volumes:
      - workspace-artifacts:/data/artifacts
    depends_on: *db-depends
    restart: unless-stopped

  tool-service:
    build:
      <<: *python-build
      args:
        SERVICE: tool-service
    image: beauty-moon/tool-service:local
    environment:
      TOOL__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_tool
      TOOL__AUTO_CREATE_TABLES: 'false'
      TOOL__AUTH_ENABLED: 'false'
      TOOL__INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      # 账号 JWT 由 account-service 内部签发(TokenBroker);容器内不能用 127.0.0.1
      TOOL__AUTH_ISSUER: http://account-service:8001
      # 沙箱统一经 workspace-service 的 :ensure 接口(见 docs/design/tool-service.md)
      TOOL__WORKSPACE_SERVICE_URL: http://workspace-service:8005
      # 连接器工具:代理到 connector-service 内部端点(须与其 INTERNAL_SECRET 同值)
      TOOL__CONNECTOR_BASE_URL: http://connector-service:8004
      TOOL__CONNECTOR_INTERNAL_SECRET: ${CONNECTOR_INTERNAL_SECRET:-compose-demo-connector-internal-secret}
    depends_on:
      <<: *db-depends
      account-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      <<: *python-build
      args:
        SERVICE: api-gateway
    image: beauty-moon/api-gateway:local
    environment:
      API_GATEWAY__APP_ORIGIN: http://localhost:8080
      API_GATEWAY__RUNTIME_BASE_URL: http://agent-orchestrator:8002
      API_GATEWAY__ACCOUNT_BASE_URL: http://account-service:8001
      API_GATEWAY__WORKSPACE_BASE_URL: http://workspace-service:8005
      API_GATEWAY__KNOWLEDGE_BASE_URL: http://knowledge-service:8006
      API_GATEWAY__CONNECTOR_BASE_URL: http://connector-service:8004
      API_GATEWAY__LLM_GATEWAY_BASE_URL: http://llm-gateway:8003
      API_GATEWAY__RUNTIME_PUBLIC_URL: http://localhost:8080
      # 不能用 API 网关内置的 dev 默认值:否则 /readyz 会 503(见 services/api-gateway/api_gateway/api/health.py)。
      API_GATEWAY__SESSION_SECRET: ${API_GATEWAY_SESSION_SECRET:-compose-demo-session-secret-change-me}
      # 与 account / orchestrator 的内部签发密钥保持同值,内部调用才能互认。
      API_GATEWAY__INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      API_GATEWAY__COOKIE_SECURE: 'false'
      API_GATEWAY__READY_PROBE_UPSTREAMS: ${READY_PROBE_UPSTREAMS:-false}
      # /api 限流共享计数;注释掉该行即回退进程内滑动窗口。
      API_GATEWAY__REDIS_URL: redis://redis:6379/0
    depends_on:
      <<: *db-depends
      redis:
        condition: service_healthy
      account-service:
        condition: service_healthy
      agent-orchestrator:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      connector-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Web:静态 SPA + Nginx(同源 /api → api-gateway:8007) ─────────────────────────
  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        # 同源 API 网关 Cookie 登录;token 模式需直连 account-service:8001,本编排未暴露(见 README)。
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-session}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
        # 前端 Sentry 错误/性能追踪;留空则完全不初始化。
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-}
    image: beauty-moon/web:local
    ports:
      - '8080:80'
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ── 观测:OTel Collector(可选尾部采样,observability profile)──────────────
  # 服务侧设 OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4318/v1/traces 后,trace 先到
  # 这里做尾部采样(错误/慢请求全留 + 10% 基线)再发往 Langfuse。
  # 配置见 deploy/otel-collector/config.yaml;直连模式不需要这个服务。
  otel-collector:
    profiles: ['observability']
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_IMAGE_TAG:-0.115.1}
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    environment:
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    restart: unless-stopped

  # ── 观测:Langfuse v4(可选 profile,默认不启动) ───────────────────────────
  # 设计见 docs/design/langfuse-observability.md。启用:
  #   docker compose -f deploy/docker-compose.yml --profile observability up -d
  #   LANGFUSE_ENABLED=true docker compose -f deploy/docker-compose.yml up -d \
  #     agent-orchestrator llm-gateway        # 重新创建服务才会读到新环境变量
  # UI/登录:http://localhost:3001(dev@beauty-moon.local / beauty-moon)
  # 尾部采样(可选):让服务先把 trace 发给 otel-collector(服务侧必须全采):
  #   TRACE_SAMPLE_RATIO=1.0 OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4318/v1/traces \
  #     docker compose -f deploy/docker-compose.yml --profile observability up -d
  # 对外暴露:web、MinIO 控制台(9091)与 Collector 的 4317/4318;其余只在内网可达,
  # 避免与主栈的 postgres:5432 / redis:6379 抢端口(所以不映射宿主机端口)。
  # 数据卷全部独立,down -v 只清观测数据;主栈运行不依赖这个 profile。
  langfuse-postgres:
    image: docker.io/postgres:17-alpine
    profiles: ['observability']
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse-demo-password
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    profiles: ['observability']
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: langfuse-demo-password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    profiles: ['observability']
    entrypoint: sh
    # 启动前先建 langfuse bucket(Langfuse 的 events/media 上传都落这里)
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-demo-password
    ports:
      # 控制台;S3 API 9000 只在 compose 内网供 langfuse-web/worker 使用
      - '9091:9001'
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  langfuse-redis:
    image: docker.io/redis:7-alpine
    profiles: ['observability']
    # Langfuse 的 BullMQ 队列要求 noeviction,与主栈缓存用 redis 分开部署
    command: >
      --requirepass langfuse-demo-password
      --maxmemory-policy noeviction
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a langfuse-demo-password ping | grep -q PONG']
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    profiles: ['observability']
    depends_on: *langfuse-depends
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://langfuse:langfuse-demo-password@langfuse-postgres:5432/langfuse
      # 演示口令;生产用 openssl rand -hex 32 生成 ENCRYPTION_KEY
      SALT: beauty-moon-langfuse-demo-salt
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: langfuse-demo-password
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: langfuse-redis
      REDIS_PORT: '6379'
      REDIS_AUTH: langfuse-demo-password
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio-demo-password
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minio-demo-password
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    restart: unless-stopped

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    profiles: ['observability']
    depends_on: *langfuse-depends
    ports:
      # 主栈 web 占 8080、官网 site 占 3000,这里用 3001
      - '3001:3000'
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: beauty-moon-langfuse-demo-nextauth-secret
      # 浏览器直连 minio 控制台端口做媒体预览;容器间走内网端点
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9091
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # 无 UI 初始化:org/project/首用户固定下来,与 Python 服务里的 pk/sk 对齐
      LANGFUSE_INIT_ORG_ID: beauty-moon
      LANGFUSE_INIT_ORG_NAME: beauty-moon
      LANGFUSE_INIT_PROJECT_ID: beauty-moon-agent
      LANGFUSE_INIT_PROJECT_NAME: beauty-moon agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-beauty
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-beauty
      LANGFUSE_INIT_USER_EMAIL: dev@beauty-moon.local
      LANGFUSE_INIT_USER_NAME: beauty-moon
      LANGFUSE_INIT_USER_PASSWORD: beauty-moon
    restart: unless-stopped

volumes:
  pgdata:
  account-keys:
  workspace-artifacts:
  # Langfuse(observability profile)
  langfuse-pgdata:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:

