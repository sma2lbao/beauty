# beauty-moon 全栈演示编排(docs/refactoring/rfc/005-w4.md §R-36)。
#
# 快速开始(在仓库根执行):
#   docker compose -f deploy/docker-compose.yml up -d --build
#   浏览器打开 http://localhost:8080
# 只起基础设施(本地开发常用,docs/local-dev.md):
#   docker compose -f deploy/docker-compose.yml up -d postgres redis
# 停止/重置数据:
#   docker compose -f deploy/docker-compose.yml down        # 保留数据卷
#   docker compose -f deploy/docker-compose.yml down -v     # 连数据卷一起删(重建 5 个库)
#
# 设计要点:
# - 7 个 Python 服务复用同一个镜像(deploy/docker/python-service.Dockerfile,靠 SERVICE 选入口);
# - 5 个有 alembic 迁移的服务各自一个库,由 initdb 脚本建库 + migrate 一次性作业升级;
#   原因见 deploy/postgres/initdb/01-create-databases.sql(alembic_version 表名冲突);
# - web 容器(nginx)同源托管 SPA 并反代 /api → bff:8007;浏览器只访问 :8080 一个入口;
# - 健康探针一律打 /healthz(进程存活,不依赖数据库);/readyz 是给编排层的就绪建议;
# - 所有演示用密钥可用宿主机环境变量覆盖(见 deploy/web/README.md「生产差异」),
#   默认值只用于本机演示,禁止直接用于生产。
name: beauty-moon

x-python-build: &python-build
  context: ..
  dockerfile: deploy/docker/python-service.Dockerfile

# 有数据库的服务统一:等 postgres 健康 + migrate 升级成功后再启动。
x-db-depends: &db-depends
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  # ── 基础设施 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
      POSTGRES_DB: beauty
    ports:
      # 只为本地 psql/alembic 调试暴露;生产请删掉端口映射,只走 compose 内网。
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅首次初始化数据卷时执行:建 5 个服务库(beauty_account 等)。
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # 当前代码没有任何 redis 依赖(限流是进程内实现),仅预留:保留容器便于后续
    # 限流/缓存/队列接入时直接使用,可在不需要时注释掉。
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 一次性迁移作业:按服务库顺序 alembic upgrade head ──────────────────────
  # 用 Python 服务镜像即可:根 .venv 同时装了 alembic 与全部服务包;
  # 每个服务 migrations/env.py 从自己的 <PREFIX>__DATABASE_URL 读库地址。
  migrate:
    build:
      <<: *python-build
      args:
        SERVICE: bff
    image: beauty-moon/python-migrate:local
    command:
      - sh
      - -c
      - |
        set -eu
        cd /app/services/account-service && alembic upgrade head
        cd ../agent-orchestrator && alembic upgrade head
        cd ../connector-service && alembic upgrade head
        cd ../knowledge-service && alembic upgrade head
        cd ../workspace-service && alembic upgrade head
        echo "migrations: all 5 databases at head"
    environment:
      ACCOUNT__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_account
      AGENT_ORCHESTRATOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_agent
      CONNECTOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_connector
      KNOWLEDGE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_knowledge
      WORKSPACE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Python 服务(同一镜像、不同 SERVICE) ─────────────────────────────────
  account-service:
    build:
      <<: *python-build
      args:
        SERVICE: account-service
    image: beauty-moon/account-service:local
    environment:
      ACCOUNT__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_account
      ACCOUNT__AUTO_CREATE_TABLES: "false"
      # 演示统一关鉴权(BFF 仍按 session 流程代理;生产改 true 并配 issuer/JWKS)
      ACCOUNT__AUTH_ENABLED: "false"
      # 签名密钥落 /data/keys 具名卷,重启不轮换 kid(生产必须持久化,见 README)
      ACCOUNT__SIGNING_KEY_PATH: /data/keys/account-signing-key.pem
      ACCOUNT__INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      ACCOUNT__OAUTH_STATE_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      ACCOUNT__OAUTH21_WEB_ORIGIN: http://localhost:8080
    volumes:
      - account-keys:/data/keys
    depends_on: *db-depends
    restart: unless-stopped

  agent-orchestrator:
    build:
      <<: *python-build
      args:
        SERVICE: agent-orchestrator
    image: beauty-moon/agent-orchestrator:local
    environment:
      AGENT_ORCHESTRATOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_agent
      AGENT_ORCHESTRATOR__AUTO_CREATE_TABLES: "false"
      AGENT_ORCHESTRATOR__AUTH_ENABLED: "false"
      AGENT_ORCHESTRATOR__INTERNAL_AUTH_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      AGENT_ORCHESTRATOR__ACCOUNT_SERVICE_URL: http://account-service:8001
      AGENT_ORCHESTRATOR__LLM_GATEWAY_URL: http://llm-gateway:8003
      # 演示默认不连真实模型:置 LLM_ENABLED=true 并给 LLM_GATEWAY_API_KEY 后
      # 工作台对话走真实模型(见 README「接入真实模型」)。
      AGENT_ORCHESTRATOR__LLM_ENABLED: ${LLM_ENABLED:-false}
      AGENT_ORCHESTRATOR__TOOLS_ENABLED: "false"
      AGENT_ORCHESTRATOR__KNOWLEDGE_ENABLED: "false"
      AGENT_ORCHESTRATOR__KNOWLEDGE_SERVICE_URL: http://knowledge-service:8006
      AGENT_ORCHESTRATOR__WORKSPACE_ENABLED: "false"
      AGENT_ORCHESTRATOR__WORKSPACE_SERVICE_URL: http://workspace-service:8005
      AGENT_ORCHESTRATOR__OUTBOX_ENABLED: "false"
      AGENT_ORCHESTRATOR__MCP_SECRET: ${MCP_SECRET:-compose-demo-mcp-secret-change-me}
      AGENT_ORCHESTRATOR__MCP_RESOURCE_URL: http://localhost:8080/mcp
      AGENT_ORCHESTRATOR__MCP_OAUTH_REDIRECT_URI: http://localhost:8080/api/mcp/oauth/callback
      AGENT_ORCHESTRATOR__CORS_ALLOW_ORIGINS: '["http://localhost:8080"]'
    depends_on: *db-depends
    restart: unless-stopped

  llm-gateway:
    build:
      <<: *python-build
      args:
        SERVICE: llm-gateway
    image: beauty-moon/llm-gateway:local
    environment:
      # 模型提供商凭据由宿主机环境变量透传;留空则每次请求 502(服务本身仍健康)。
      LLM_GATEWAY__API_KEY: ${LLM_GATEWAY_API_KEY:-}
      LLM_GATEWAY__API_BASE: ${LLM_GATEWAY_API_BASE:-}
      LLM_GATEWAY__DEFAULT_MODEL: ${LLM_GATEWAY_DEFAULT_MODEL:-deepseek/deepseek-chat}
    restart: unless-stopped

  connector-service:
    build:
      <<: *python-build
      args:
        SERVICE: connector-service
    image: beauty-moon/connector-service:local
    environment:
      CONNECTOR__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_connector
      CONNECTOR__AUTO_CREATE_TABLES: "false"
      CONNECTOR__AUTH_ENABLED: "false"
      CONNECTOR__CREDENTIAL_SECRET: ${CONNECTOR_CREDENTIAL_SECRET:-compose-demo-connector-secret-change-me}
    depends_on: *db-depends
    restart: unless-stopped

  knowledge-service:
    build:
      <<: *python-build
      args:
        SERVICE: knowledge-service
    image: beauty-moon/knowledge-service:local
    environment:
      KNOWLEDGE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_knowledge
      KNOWLEDGE__AUTO_CREATE_TABLES: "false"
      KNOWLEDGE__AUTH_ENABLED: "false"
      # 演示用本地词法嵌入(零网络);接真嵌入模型时改为网关提供方。
      KNOWLEDGE__EMBEDDING_PROVIDER: local
      KNOWLEDGE__LLM_GATEWAY_URL: http://llm-gateway:8003
    depends_on: *db-depends
    restart: unless-stopped

  workspace-service:
    build:
      <<: *python-build
      args:
        SERVICE: workspace-service
    image: beauty-moon/workspace-service:local
    environment:
      WORKSPACE__DATABASE_URL: postgresql+asyncpg://beauty:beauty@postgres:5432/beauty_workspace
      WORKSPACE__AUTO_CREATE_TABLES: "false"
      WORKSPACE__AUTH_ENABLED: "false"
      WORKSPACE__ARTIFACT_ROOT: /data/artifacts
      # 演示不启动沙箱回收器(否则会尝试连接 microsandbox 运行时并刷错误日志)
      WORKSPACE__SANDBOX_REAPER_ENABLED: "false"
    volumes:
      - workspace-artifacts:/data/artifacts
    depends_on: *db-depends
    restart: unless-stopped

  bff:
    build:
      <<: *python-build
      args:
        SERVICE: bff
    image: beauty-moon/bff:local
    environment:
      BFF__APP_ORIGIN: http://localhost:8080
      BFF__RUNTIME_BASE_URL: http://agent-orchestrator:8002
      BFF__ACCOUNT_BASE_URL: http://account-service:8001
      BFF__WORKSPACE_BASE_URL: http://workspace-service:8005
      BFF__KNOWLEDGE_BASE_URL: http://knowledge-service:8006
      BFF__CONNECTOR_BASE_URL: http://connector-service:8004
      BFF__LLM_GATEWAY_BASE_URL: http://llm-gateway:8003
      BFF__RUNTIME_PUBLIC_URL: http://localhost:8080
      # 不能用 BFF 内置的 dev 默认值:否则 /readyz 会 503(见 services/bff/bff/api/health.py)。
      BFF__SESSION_SECRET: ${BFF_SESSION_SECRET:-compose-demo-session-secret-change-me}
      # 与 account / orchestrator 的内部签发密钥保持同值,内部调用才能互认。
      BFF__INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      BFF__COOKIE_SECURE: "false"
      BFF__READY_PROBE_UPSTREAMS: ${READY_PROBE_UPSTREAMS:-false}
    depends_on:
      <<: *db-depends
      account-service:
        condition: service_healthy
      agent-orchestrator:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      connector-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Web:静态 SPA + Nginx(同源 /api → bff:8007) ─────────────────────────
  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        # 同源 BFF Cookie 登录;token 模式需直连 account-service:8001,本编排未暴露(见 README)。
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-session}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
    image: beauty-moon/web:local
    ports:
      - "8080:80"
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  account-keys:
  workspace-artifacts:
