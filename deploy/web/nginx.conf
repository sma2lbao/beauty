# beauty moon SPA + API 网关同源 Nginx 配置(M0-01;R-37 补探针与 TLS 段)
#
# 部署结构:同一域名下
#   /            -> apps/web/dist 静态文件(SPA,深链回退 index.html)
#   /api/        -> FastAPI API 网关(:8007),由网关再访问内部服务
#   /healthz /readyz -> 反代 API 网关探针(容器/负载均衡外部探活用,不得落到 SPA 回退)
#
# 容器内 API 网关服务名是 api-gateway;裸机部署把 upstream 改成 127.0.0.1:8007。

# 网关侧访问日志格式(本文件在 conf.d 内属 http 上下文,log_format 只能定义在 server 之前)。
#
# 与 API 网关自己的 `proxy_call` 事件互补,两者缺一不可:
#   - `proxy_call`(api-gateway 进程)是「网关 → 上游」的应用层视角,duration_ms 到上游响应头
#     (流式请求即 TTFB),回答「后端哪个服务慢、慢在哪条路由」;
#   - 这里(Nginx)是「客户端 → Nginx → 网关」的接入层视角,带 $request_time(含连接建立、
#     客户端读写)与 $upstream_response_time,回答「慢在 Nginx 内侧还是网关/后端」。
#     只看其中一边时,「网关慢」与「后端慢」会混成一团。
#
# `$http_x_request_id` 是客户端带来的请求头:前端未显式生成时为 `-`(网关会补一个并回写
# 响应头 `X-Request-ID`,需要时可用 `$upstream_http_x_request_id` 关联,本文按最小字段集记录)。
# `$remote_addr` 是客户端地址:网关的 `http_request` 不记 client_ip,用户侧 IP 只在这一行。
# `$upstream_addr`/`$upstream_status`/`$upstream_response_time` 在网关不可达或未转发时为 `-`;
# 有重试时是逗号分隔的列表(与 `$upstream_addr` 顺序对齐)。
log_format api_gateway escape=json
    '{"time":"$time_iso8601",'
    '"event":"nginx_upstream",'
    '"request_id":"$http_x_request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"remote_addr":"$remote_addr",'
    '"status":$status,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":$request_time}';

upstream api_gateway_upstream {
    server api-gateway:8007;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的静态资源:长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 健康探针(R-37):精确匹配反代 API 网关,绝不能落到 SPA 的 try_files 回退——
    # 否则负载均衡/容器编排探活会拿到 index.html(200),失效切换形同虚设。
    # 裸机部署时 upstream 已是 127.0.0.1:8007,无需改动。
    location = /healthz {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /readyz {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # API 网关:同源 /api,前端不需要配置跨域;SSE 由网关代理时关闭缓冲
    location /api/ {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 接入层上游字段(格式见文件顶部 log_format api_gateway):
        # 与网关 `proxy_call` 一起定位「网关慢还是后端慢」。
        access_log /dev/stdout api_gateway;
    }

    # SPA 深链:真实文件优先,其余回退 index.html(刷新不 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# ---------------------------------------------------------------------------
# TLS(R-37):默认注释——本地/裸跑不需要证书;启用 HTTPS 时按下列步骤放开。
#
# 启用步骤:
#   1. 上面的 80 server 块改成 80→443 跳转(把 location 段整体挪进 443 server):
#        server {
#            listen 80;
#            server_name www.example.com;
#            return 301 https://$host$request_uri;
#        }
#   2. 放开下方 443 server 块,证书路径按实际填写(certbot 或企业证书两条路,
#      见 deploy/web/README.md);
#   3. 证书续期后 nginx -s reload 即可,不中断连接。
# ---------------------------------------------------------------------------
#
# server {
#     listen 443 ssl;
#     server_name www.example.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 10m;
#
#     root /usr/share/nginx/html;
#     index index.html;
#     charset utf-8;
#     client_max_body_size 20m;
#
#     # ...其余 location(/assets/、/healthz、/readyz、/api/、/)与 80 块相同
# }
