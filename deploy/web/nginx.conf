# beauty moon SPA + BFF 同源 Nginx 配置(M0-01)
#
# 部署结构:同一域名下
#   /            -> apps/web/dist 静态文件(SPA,深链回退 index.html)
#   /api/        -> FastAPI BFF(:8007),由 BFF 再访问内部服务
#
# 容器内 BFF 服务名是 bff;裸机部署把 upstream 改成 127.0.0.1:8007。

upstream bff_upstream {
    server bff:8007;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的静态资源:长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # BFF:同源 /api,前端不需要配置跨域;SSE 由 BFF 代理时关闭缓冲
    location /api/ {
        proxy_pass http://bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 深链:真实文件优先,其余回退 index.html(刷新不 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
