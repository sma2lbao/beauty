[project]
name = "llm-gateway"
version = "0.1.0"
description = "模型网关:全平台唯一的 LLM/embedding 调用出口(架构 §5,litellm 统一路由)"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    # 共享库(uv workspace,本地 editable)
    "common",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "litellm>=1.105.0",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-socket>=0.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_gateway"]

[tool.coverage.run]
branch = true
source = ["llm_gateway"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/services/llm-gateway/html'
 --cov-report xml:'../../coverage/services/llm-gateway/coverage.xml'
 --html='../../reports/services/llm-gateway/unittests/html/index.html'
 --junitxml='../../reports/services/llm-gateway/unittests/junit.xml'
 --cov-fail-under=95
 --disable-socket --allow-unix-socket
"""

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.vercel]
# Vercel Python runtime 只自动识别根级 app.py/main.py 等入口；本服务的 app 在
# llm_gateway/main.py，必须用 tool.vercel.entrypoint 显式声明。vercel.json 的 functions
# key 与该入口文件对应；依赖/部署约束见 docs/design/serverless-deployment.md §7.6。
entrypoint = "llm_gateway.main:app"
