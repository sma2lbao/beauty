[project]
name = "api-gateway"
version = "0.1.0"
description = "API 网关:同源 API 门面(健康检查;后续认证/代理/限流/下载/stream token)"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "common",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["api_gateway"]

[tool.coverage.run]
branch = true
source = ["api_gateway"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/services/api-gateway/html'
 --cov-report xml:'../../coverage/services/api-gateway/coverage.xml'
 --html='../../reports/services/api-gateway/unittests/html/index.html'
 --junitxml='../../reports/services/api-gateway/unittests/junit.xml'
 --cov-fail-under=81
 --disable-socket --allow-unix-socket
"""
asyncio_mode = "auto"

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.vercel]
# Vercel Python runtime 只自动识别根级 app.py/main.py 等入口；本服务的 app 在
# api_gateway/main.py，必须用 tool.vercel.entrypoint 显式声明。vercel.json 的 functions
# key 与该入口文件对应；依赖/部署约束见 docs/design/serverless-deployment.md §7.6。
entrypoint = "api_gateway.main:app"
