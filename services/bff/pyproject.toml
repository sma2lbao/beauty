[project]
name = "bff"
version = "0.1.0"
description = "BFF:同源 API 门面(健康检查;后续认证/代理/限流/下载/stream token)"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "common",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["bff"]

[tool.coverage.run]
branch = true
source = ["bff"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/services/bff/html'
 --cov-report xml:'../../coverage/services/bff/coverage.xml'
 --html='../../reports/services/bff/unittests/html/index.html'
 --junitxml='../../reports/services/bff/unittests/junit.xml'
 --cov-fail-under=81
 --disable-socket --allow-unix-socket
"""
asyncio_mode = "auto"

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
