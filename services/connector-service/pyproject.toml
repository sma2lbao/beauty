[project]
name = "connector-service"
version = "0.1.0"
description = "连接器服务:外部系统连接器框架(连接存储/凭证加密/租户隔离;当前无内置连接器,架构 §8)"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "alembic>=1.20.0",
    # 共享库(uv workspace,本地 editable)
    "asyncpg>=0.32.0",
    "common",
    "database",
    "events",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
common = { workspace = true }
database = { workspace = true }
events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["connector"]

[tool.coverage.run]
branch = true
# SQLAlchemy async 经 greenlet 桥接同步 DB 调用;不声明 greenlet 时,
# await 之后的帧会丢追踪,导致服务层行被误报为未覆盖。
concurrency = ["greenlet", "thread"]
source = ["connector"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/services/connector-service/html'
 --cov-report xml:'../../coverage/services/connector-service/coverage.xml'
 --html='../../reports/services/connector-service/unittests/html/index.html'
 --junitxml='../../reports/services/connector-service/unittests/junit.xml'
 --cov-fail-under=91
 --disable-socket --allow-unix-socket
"""
asyncio_mode = "auto"

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.vercel]
# Vercel Python runtime 只自动识别根级 app.py/main.py 等入口；本服务的 app 在
# connector/main.py，必须用 tool.vercel.entrypoint 显式声明。vercel.json 的 functions
# key 与该入口文件对应；依赖/部署约束见 docs/design/serverless-deployment.md §7.6。
entrypoint = "connector.main:app"
