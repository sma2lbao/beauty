# W0 R-03 最小 CI（RFC-001 docs/refactoring/rfc/001-w0.md）
# 约定（docs/refactoring-playbook.md §6.1/§6.3）：
#   - JS 测试必须 `-- --run`（nx.json testMode: "watch"，否则 vitest 挂住）；
#   - 一律不用 test-ci（Nx Cloud atomized target，本地/自托管不可用）；
#   - Python target 一律固化 uv 缓存到仓库本地（UV_CACHE_DIR/UV_PYTHON_INSTALL_DIR，.gitignore 已覆盖）；
#   - CI 命令必须与本地门禁矩阵（playbook §6.1）逐条等价。
#   - 覆盖率门禁：TS 用 vitest coverage.thresholds（唯一数字来源是根 vitest.config.mts 的 thresholds；
#     CI 必须真正带 --coverage 才会校验，否则阈值是假门禁）；
#     Python 用各项目 pyproject.toml [tool.pytest.ini_options].addopts 的 --cov-fail-under
#     （pytest 自动读取，CI 不重复传参，避免阈值出现第二份真源）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 全 job 固化的 uv 环境（R-01 同款，见 playbook §9.7：受限环境必须显式设置，否则 Python target 直接失败）。
  # 必须用绝对路径：nx 的 Python target 与 alembic step 都以项目目录为 CWD 执行 uv，
  # 相对路径会解析到各子目录下（本地约定同 §6.3 的 $PWD 绝对路径）。
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python

jobs:
  # ------------------------------------------------------------------
  # Job 1/9：setup——安装依赖并预热 uv/npm 缓存（其余 job 依赖本 job）
  # ------------------------------------------------------------------
  setup:
    name: setup (deps + caches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx affected 需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false # 缓存目录由下方 action 按仓库本地路径恢复
          python-version: '3.12'

      - name: Cache local uv dirs
        uses: actions/cache@v4
        with:
          path: |
            .uv-cache
            .uv-python
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Sync shared venv (uv workspace)
        # 与本地等价：npx nx run common:sync（不能写 npx nx sync common，会被 Nx 内置命令抢占）
        run: npx nx run common:sync

  # ------------------------------------------------------------------
  # Job 2/9：docs-check——W1 R-16 文档门禁（prettier 格式 + 相对链接 + 锚点 + 归档误引）
  # 与本地等价：bash scripts/check-docs.sh（纯 bash+node，无 Python 依赖，可与 setup 并行）
  # ------------------------------------------------------------------
  docs-check:
    name: docs-check (prettier + links)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Docs gate (prettier + links + anchors)
        run: bash scripts/check-docs.sh

      - name: Workspace hygiene (archive notes + docs index + tracked artifacts)
        # W4 R-38：与 refactor-gate.sh 的 workspace 段共用同一脚本，避免本地/CI 判据漂移。
        run: bash scripts/check-workspace.sh

  # ------------------------------------------------------------------
  # Job 3/9：security-audit——W4 R-35 安全扫描（生产面阻断 + 全量非阻断 + 清单校验）
  # 生产依赖必须 0 high；dev 工具链漏洞非阻断留报告；允许清单到期即失败。
  # ------------------------------------------------------------------
  security-audit:
    name: security-audit (npm + pip)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: JS production deps audit (blocking)
        # 生产依赖 0 high 才放行;默认 registry 是镜像(audit 404),必须显式指 npmjs。
        # 本地等价:npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high
        run: npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high

      - name: JS full audit (non-blocking, dev toolchain report)
        # 全量(含 dev 工具链)只留报告不阻断;已登记允许清单的见 security/audit-allowlist.json。
        run: npm audit --registry=https://registry.npmjs.org || true

      - name: Audit allowlist validity (blocking)
        # 允许清单条目到期即失败,强制季度复核(docs/security.md)。
        run: node scripts/check-audit-allowlist.cjs

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Python deps audit via pip-audit (blocking)
        # 导出全量 requirements(含 workspace 解析)后 pip-audit;本地 pypi 不可达,仅 CI 可跑。
        run: |
          uv export --format requirements-txt --no-hashes > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  # ------------------------------------------------------------------
  # Job 4/9：affected-js——JS/TS affected lint + typecheck + build，再逐项目跑 test + coverage
  # ------------------------------------------------------------------
  affected-js:
    name: affected-js (lint+typecheck+build+test)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint / typecheck / build (affected)
        # 与本地等价：npx nx affected -t lint,typecheck,build --base=origin/main
        # nx 只对存在该 target 的项目执行（无对应 target 的项目自动跳过）
        run: npx nx affected -t lint,typecheck,build --base=origin/main

      # 覆盖率门禁（R-31b）：阈值唯一数字来源是根 vitest.config.mts 的 `thresholds`，
      # 各项目 vitest 配置 import 后挂到自身 coverage.thresholds；这里必须带 --coverage。
      # 不用 `nx affected -t test`：该 target 集合包含 10 个 Python 项目，`--` 后的
      # --run/--coverage 会被透传给 pytest（unrecognized arguments）而挂掉；
      # 因此 TS 测试仍逐项目显式执行，与本地门禁逐条等价。
      - name: Test + coverage @beauty/web
        # 与本地等价：npx nx test @beauty/web -- --run（加 --coverage 后走 R-31b 阈值）
        run: npx nx test @beauty/web -- --run --coverage
      - name: Test + coverage @beauty/design
        run: npx nx test @beauty/design -- --run --coverage
      - name: Test + coverage @beauty/console-ui
        run: npx nx test @beauty/console-ui -- --run --coverage
      - name: Test + coverage @beauty/site
        run: npx nx test @beauty/site -- --run --coverage

      # @beauty/desktop 的 test target 连跑两段 vitest（renderer 与 main/preload/node），
      # `nx test ... -- --run --coverage` 只会把参数透传给最后一段，renderer 覆盖率会漏掉；
      # 所以这里显式跑两段都带 --coverage（R-31b 为 desktop 配了 renderer/node 两套阈值）。
      - name: Test + coverage @beauty/desktop (renderer)
        working-directory: apps/desktop
        run: npx vitest run --config vitest.config.mts --coverage
      - name: Test + coverage @beauty/desktop (main/preload)
        working-directory: apps/desktop
        run: npx vitest run --config vitest.node.config.mts --coverage

  # ------------------------------------------------------------------
  # Job 5/9：python-lint——10 个 Python 项目逐个 npx nx lint
  # ------------------------------------------------------------------
  python-lint:
    name: python-lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            common,
            database,
            events,
            agent-orchestrator,
            llm-gateway,
            connector-service,
            knowledge-service,
            account-service,
            workspace-service,
            bff,
          ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Cache local uv dirs
        uses: actions/cache@v4
        with:
          path: |
            .uv-cache
            .uv-python
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Lint ${{ matrix.project }}
        # 与本地等价：npx nx lint <项目>（底层 uv run ruff check；缓存已固化）
        run: npx nx lint ${{ matrix.project }}

  # ------------------------------------------------------------------
  # Job 6/9：python-test——10 个 Python 项目逐个 npx nx test（覆盖率阈值见各项目 pyproject addopts）
  # ------------------------------------------------------------------
  python-test:
    name: python-test (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            common,
            database,
            events,
            agent-orchestrator,
            llm-gateway,
            connector-service,
            knowledge-service,
            account-service,
            workspace-service,
            bff,
          ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Cache local uv dirs
        uses: actions/cache@v4
        with:
          path: |
            .uv-cache
            .uv-python
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Test ${{ matrix.project }}
        # 与本地等价：npx nx test <项目>（底层 uv run pytest tests/，零网络；缓存已固化）
        # 覆盖率阈值：写在各项目 pyproject.toml 的 [tool.pytest.ini_options].addopts
        # （--cov-fail-under=<实测向下取整>，R-31a）；pytest 以项目目录为 CWD 运行会自动读取，
        # 因此本 job 不重复传 --cov/--cov-fail-under，阈值只有一份真源。
        run: npx nx test ${{ matrix.project }}

  # ------------------------------------------------------------------
  # Job 7/9：lock-check——uv.lock 与 package-lock.json 与清单一致
  # ------------------------------------------------------------------
  lock-check:
    name: lock-check (uv + npm)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Cache local uv dirs
        uses: actions/cache@v4
        with:
          path: |
            .uv-cache
            .uv-python
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: uv lock --check (uv.lock 与 pyproject.toml 一致)
        # 与本地等价：uv lock --check；退出码非 0 即不一致
        run: uv lock --check

      - name: npm lockfile consistency check
        # 不能用 `npm install --package-lock-only` + git diff：它会按当前 OS 重写可选平台
        # 依赖的 libc 字段（Linux 生成物与提交的 macOS 版本不一致），在 CI 上必然误报。
        # `npm ci --dry-run` 在 lock 与 package.json 不一致时直接报错，且不写文件。
        run: npm ci --dry-run --ignore-scripts

  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Job 8/9：alembic-check——5 个有迁移的服务模型与迁移一致
  # ------------------------------------------------------------------
  alembic-check:
    name: alembic-check (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-orchestrator
            db_env: AGENT_ORCHESTRATOR__DATABASE_URL
          - service: connector-service
            db_env: CONNECTOR__DATABASE_URL
          - service: knowledge-service
            db_env: KNOWLEDGE__DATABASE_URL
          - service: account-service
            db_env: ACCOUNT__DATABASE_URL
          - service: workspace-service
            db_env: WORKSPACE__DATABASE_URL
    # 用真 Postgres 而不是 sqlite：AO/account 的迁移含 PG 专有 DDL（ALTER ... USING 等），
    # 在 sqlite 上 upgrade 直接 SyntaxError（W2 实测）；生产也跑 PG，这里才是最权威的门。
    # 每个 matrix job 各自一个容器，因此 5 个服务共用一个库名不会互相污染。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beauty
          POSTGRES_PASSWORD: beauty
          POSTGRES_DB: beauty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beauty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Cache local uv dirs
        uses: actions/cache@v4
        with:
          path: |
            .uv-cache
            .uv-python
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Alembic check (${{ matrix.service }})
        # alembic check 会连接数据库比对版本，空库直接跑必红
        # （"Target database is not up to date." EXIT 255，W2 R-24 实测），
        # 因此先在一次性空库上 upgrade head，再 check 模型与迁移一致。
        # 不读服务自己的 .env / 本地库，避免污染与"看起来绿"的假象（playbook §6.1）。
        working-directory: services/${{ matrix.service }}
        env:
          DB_ENV: ${{ matrix.db_env }}
        run: |
          export "${DB_ENV}=postgresql+asyncpg://beauty:beauty@localhost:5432/beauty"
          uv run alembic upgrade head
          uv run alembic check

  # ------------------------------------------------------------------
  # Job 9/9：docker-build——W4 R-36 镜像可构建性（本机 docker daemon 不可用，构建正确性只能 CI 验）
  # 等价本地：docker compose -f deploy/docker-compose.yml config -q
  # ------------------------------------------------------------------
  docker-build:
    name: docker-build (compose 校验 + py/web 镜像)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate compose file
        # 纯语法/变量解析校验（不需要 daemon），本地等价命令见上。
        run: docker compose -f deploy/docker-compose.yml config -q

      - uses: docker/setup-buildx-action@v3

      - name: Build python-service image (SERVICE=bff)
        # 单镜像 ARG SERVICE 覆盖 7 服务，这里只验一条代表路径 + 构建缓存。
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/python-service.Dockerfile
          build-args: SERVICE=bff
          push: false
          tags: beauty-moon/bff:ci
          cache-from: type=gha,scope=py
          cache-to: type=gha,mode=max,scope=py

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
          tags: beauty-moon/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
