[project]
name = "beauty-moon"
version = "1.0.0"
# uv workspace 容器：所有 Python 项目共享仓库根 .venv（统一 Python 3.12）
dependencies = [
    "py-utils",
    "common",
    "database",
    "events",
    "agent-orchestrator",
    "llm-gateway",
    "connector-service",
    "knowledge-service",
    "account-service",
    "workspace-service",
]

[tool.uv.workspace]
# members 为显式清单：apps/ 与 packages/ 下混有 npm 项目（web/design/ts-utils 无 pyproject.toml），
# glob 会命中无 pyproject 的目录导致 uv 报错。新 Python 项目必须在此登记。
members = [
    "packages/py-utils",
    "packages/common",
    "packages/database",
    "packages/events",
    "services/agent-orchestrator",
    "services/llm-gateway",
    "services/connector-service",
    "services/knowledge-service",
    "services/account-service",
    "services/workspace-service",
]

[tool.uv.sources.py-utils]
workspace = true

[tool.uv.sources.common]
workspace = true

[tool.uv.sources.database]
workspace = true

[tool.uv.sources.events]
workspace = true

[tool.uv.sources.agent-orchestrator]
workspace = true

[tool.uv.sources.llm-gateway]
workspace = true

[tool.uv.sources.connector-service]
workspace = true

[tool.uv.sources.knowledge-service]
workspace = true

[tool.uv.sources.account-service]
workspace = true

[tool.uv.sources.workspace-service]
workspace = true

[dependency-groups]
dev = [
    "ruff>=0.8",
    "autopep8>=2.3.1",
    "pytest>=8.3.4",
    "pytest-sugar>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-html>=4.1.1",
]
